services:
  document_db:
    container_name: document_db
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - document_db_data:/var/lib/postgresql/data

  adminer_panel:
    container_name: document_adminer_panel
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - document_db

  document_app:
    container_name: document_app
    image: document_app
    restart: unless-stopped
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["sh", "./start.sh"]
    depends_on:
      - document_db

volumes:
  document_db_data: